# Biblioteca: catálogo web de V:\ (Isengard) para OMV3.
# Las rutas y el puerto se ajustan en el fichero .env (ver .env.example).
services:
  web:
    build: .
    image: biblioteca-rpg:latest
    container_name: biblioteca-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    ports:
      - "${PUERTO:-8090}:8090"
    environment:
      BIBLIOTECA_RUTA_SMB: "${RUTA_SMB:-}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca:ro"   # la biblioteca, SOLO LECTURA
      - "${DATOS_HOST}:/datos"                # catálogo y portadas
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/salud', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3

  indexador:
    image: biblioteca-rpg:latest
    container_name: biblioteca-indexador
    depends_on: [web]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    command: ["/app/docker/indexar_periodicamente.sh"]
    environment:
      BIBLIOTECA_PROCESOS: "${PROCESOS:-2}"
      INTERVALO_HORAS: "${INTERVALO_HORAS:-6}"
      BGG_TOKEN: "${BGG_TOKEN:-}"          # RPGGeek/BGG; vacío = no se consulta
      GEEK_MINUTOS: "${GEEK_MINUTOS:-240}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca:ro"
      - "${DATOS_HOST}:/datos"
    mem_limit: 1200m
    cpus: "${CPUS_INDEXADOR:-2}"

  # El ÚNICO servicio con escritura en la biblioteca: vigila _Inbox, descomprime, propone
  # carpeta y mueve lo aprobado (nunca sobrescribe ni borra; registro en _Reorganizacion).
  clasificador:
    image: biblioteca-rpg:latest
    container_name: biblioteca-clasificador
    depends_on: [web]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    command: ["nice", "-n", "10", "python", "-m", "biblioteca_rpg.entrada"]
    environment:
      BIBLIOTECA_ENTRADA: "${ENTRADA:-_Inbox}"
      CLASIFICADOR_AUTO: "${CLASIFICADOR_AUTO:-0.9}"
      BIBLIOTECA_PROCESOS: "1"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca"      # lectura y ESCRITURA
      - "${DATOS_HOST}:/datos"
    mem_limit: 768m
    cpus: "1"
