# Biblioteca: catálogo web de V:\ (Isengard) para OMV3.
# Las rutas y el puerto se ajustan en el fichero .env (ver .env.example).
services:
  web:
    build: .
    image: biblioteca-rpg:latest
    container_name: biblioteca-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    ports:
      - "${PUERTO:-8090}:8090"
    environment:
      BIBLIOTECA_RUTA_SMB: "${RUTA_SMB:-}"
      CLASIFICADOR_AUTO: "${CLASIFICADOR_AUTO:-0.9}"   # solo para decirlo en la Entrada
      # «Revisar con el PDF»: Haiku propone la carpeta con lo que explica el dueño (sin clave, no se usa).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MAX_DOLARES_MES: "${LLM_MAX_DOLARES_MES:-10}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca:ro"   # la biblioteca, SOLO LECTURA
      - "${DATOS_HOST}:/datos"                # catálogo y portadas
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/salud', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3

  indexador:
    image: biblioteca-rpg:latest
    container_name: biblioteca-indexador
    depends_on: [web]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    command: ["/app/docker/indexar_periodicamente.sh"]
    environment:
      BIBLIOTECA_PROCESOS: "${PROCESOS:-2}"
      INTERVALO_HORAS: "${INTERVALO_HORAS:-6}"
      BGG_TOKEN: "${BGG_TOKEN:-}"          # RPGGeek/BGG; vacío = no se consulta
      GEEK_MINUTOS: "${GEEK_MINUTOS:-240}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca:ro"
      - "${DATOS_HOST}:/datos"
    mem_limit: 1200m
    cpus: "${CPUS_INDEXADOR:-2}"

  # El ÚNICO servicio con escritura en la biblioteca: vigila _Inbox, descomprime, propone
  # carpeta y mueve lo aprobado (nunca sobrescribe ni borra; registro en _Reorganizacion).
  clasificador:
    image: biblioteca-rpg:latest
    container_name: biblioteca-clasificador
    depends_on: [web]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    command: ["nice", "-n", "10", "python", "-m", "biblioteca_rpg.entrada"]
    environment:
      BIBLIOTECA_ENTRADA: "${ENTRADA:-_Inbox}"
      CLASIFICADOR_AUTO: "${CLASIFICADOR_AUTO:-0.9}"
      BIBLIOTECA_PROCESOS: "1"
      # Segunda lectura con Claude para lo dudoso (sin clave, no se usa). Límite de gasto al mes.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_MODELO: "${LLM_MODELO:-sonnet}"
      LLM_MAX_DOLARES_MES: "${LLM_MAX_DOLARES_MES:-10}"
      # Lectura nocturna por lotes con Haiku de lo que espera en la Entrada (off la apaga).
      ENTRADA_LOTES: "${ENTRADA_LOTES:-on}"
      ENTRADA_LOTES_HORA: "${ENTRADA_LOTES_HORA:-3}"
      ENTRADA_LOTES_BUSQUEDAS_DIA: "${ENTRADA_LOTES_BUSQUEDAS_DIA:-20}"
      # Posts nuevos de subreddits de rol como pistas (aplicación de solo lectura; sin claves, no se lee).
      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"
      REDDIT_USUARIO: "${REDDIT_USUARIO:-}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca"      # lectura y ESCRITURA
      - "${DATOS_HOST}:/datos"
    mem_limit: 768m
    cpus: "1"

  # Descarga de Telegram a _Inbox. Ve la biblioteca en solo lectura (para no bajar lo que ya
  # tienes) y SOLO puede escribir en la carpeta de entrada. Sin TELEGRAM_API_ID se queda en espera.
  telegram:
    image: biblioteca-rpg:latest
    container_name: biblioteca-telegram
    depends_on: [web]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-100}"
    command: ["python", "-m", "biblioteca_rpg.telegram", "vigilar"]
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_CANALES: "${TELEGRAM_CANALES:-}"
      TELEGRAM_EXTENSIONES: "${TELEGRAM_EXTENSIONES:-pdf,zip,rar,7z,cbz,cbr,epub}"
      TELEGRAM_MAX_MB: "${TELEGRAM_MAX_MB:-4000}"
      TELEGRAM_CADA_MIN: "${TELEGRAM_CADA_MIN:-10}"
      BIBLIOTECA_ENTRADA: "${ENTRADA:-_Inbox}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - "${BIBLIOTECA_HOST}:/biblioteca:ro"
      - "${BIBLIOTECA_HOST}/${ENTRADA:-_Inbox}:/biblioteca/${ENTRADA:-_Inbox}"   # escritura solo aquí
      - "${DATOS_HOST}:/datos"
    mem_limit: 384m
    cpus: "1"
